name: Сборка Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'locales/**'
      - 'vendor/imapsync/**'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить исходники и локализацию
        shell: pwsh
        run: |
          python -m compileall -q main.py app
          python -m json.tool locales/ru.json | Out-Null

      - name: Установить PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Собрать приложение
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', 'ImapSync-GUI-RU',
            '--add-data', 'locales;locales'
          )
          $engine = 'vendor/imapsync/imapsync.exe'
          if (Test-Path $engine) {
            Write-Host 'Встраиваю imapsync.exe в приложение'
            $args += @('--add-binary', "$engine;imapsync")
          } else {
            Write-Warning 'Файл vendor/imapsync/imapsync.exe не найден. Будет собрана GUI-версия без встроенного движка.'
          }
          $args += 'main.py'
          python -m PyInstaller @args
          New-Item -ItemType Directory -Force -Path package/imapsync | Out-Null
          Copy-Item dist/ImapSync-GUI-RU.exe package/
          if (Test-Path $engine) {
            Copy-Item $engine package/imapsync/
          }
          Compress-Archive -Path package/* -DestinationPath ImapSync-GUI-RU-Windows-x64.zip -Force

      - name: Загрузить комплект Windows
        uses: actions/upload-artifact@v4
        with:
          name: ImapSync-GUI-RU-Windows-x64
          path: ImapSync-GUI-RU-Windows-x64.zip
          if-no-files-found: error

      - name: Приложить комплект к GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ImapSync-GUI-RU-Windows-x64.zip
