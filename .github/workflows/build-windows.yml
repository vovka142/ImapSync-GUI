name: Сборка ImapSync-GUI и движка imapsync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'locales/**'
      - '.github/workflows/build-windows.yml'
      - 'build_imapsync.ps1'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить GUI
        uses: actions/checkout@v4
        with:
          path: gui

      - name: Получить исходники imapsync
        uses: actions/checkout@v4
        with:
          repository: imapsync/imapsync
          ref: master
          path: upstream

      - name: Установить Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
          distribution: strawberry

      - name: Установить PAR::Packer и зависимости imapsync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cpanm --version
          cpanm --notest App::cpanminus Authen::NTLM Compress::Zlib Crypt::OpenSSL::RSA Data::Uniqid Digest::HMAC Digest::HMAC_MD5 Email::Address Encode::IMAPUTF7 File::Copy::Recursive File::Tail HTTP::Daemon HTTP::Daemon::SSL HTTP::Request HTTP::Response HTTP::Status URI IO::Socket::INET6 IO::Socket::SSL IO::Tee JSON JSON::WebToken JSON::WebToken::Crypt::RSA HTML::Entities LWP::UserAgent Mail::IMAPClient Module::Implementation Module::Runtime Module::ScanDeps Net::Server Net::SSLeay Net::DNS Package::Stash Package::Stash::XS PAR::Packer Parse::RecDescent Proc::ProcessTable Readonly Regexp::Common Sys::MemInfo Term::ReadKey Try::Tiny Unicode::String

      - name: Проверить исходный код и собрать imapsync.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location upstream
          # Test::More нужен только для --tests и не должен загружаться при обычной работе.
          # В upstream он подключается глобально, из-за чего PAR требует всю цепочку Test2.
          $source = Get-Content .\imapsync -Raw
          $testImport = 'use Test::More ;'
          if (-not $source.Contains($testImport)) { throw 'Не найдена ожидаемая строка подключения Test::More в upstream imapsync' }
          $source = $source.Replace($testImport, '# Test::More отключён в portable-сборке: тесты не используются при переносе почты.')
          # Удаляем тестовые вызовы skip: они относятся только к отключённому режиму тестирования.
          $skipPattern = "(?m)^([ `t]*)skip 'No test in normal run'.*$"
          $source = [regex]::Replace($source, $skipPattern, '$1# Тестовый вызов Test::More пропущен в portable-сборке.')
          if ($source.Contains("skip 'No test in normal run'")) { throw 'Не удалось удалить тестовые вызовы skip' }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'imapsync'), $source, [System.Text.UTF8Encoding]::new($false))
          perl -c .\imapsync
          if ($LASTEXITCODE -ne 0) { throw 'Проверка синтаксиса Perl завершилась ошибкой' }
          New-Item -ItemType Directory -Force -Path ..\gui\vendor\imapsync | Out-Null
          $modules = @(
            'Authen::NTLM', 'Compress::Zlib', 'Crypt::OpenSSL::RSA',
            'Data::Uniqid', 'Digest::HMAC', 'Digest::HMAC_MD5',
            'Email::Address', 'Encode::IMAPUTF7', 'File::Copy::Recursive',
            'File::Tail', 'HTTP::Daemon', 'HTTP::Daemon::SSL',
            'HTTP::Request', 'HTTP::Response', 'HTTP::Status', 'URI',
            'IO::Socket::INET6', 'IO::Socket::SSL', 'IO::Tee', 'JSON',
            'JSON::WebToken', 'JSON::WebToken::Crypt::RSA', 'HTML::Entities',
            'LWP::UserAgent', 'Mail::IMAPClient', 'Module::Implementation',
            'Module::Runtime', 'Net::Server', 'Net::SSLeay', 'Net::DNS',
            'Package::Stash', 'Package::Stash::XS', 'Parse::RecDescent',
            'Proc::ProcessTable', 'Readonly', 'Regexp::Common', 'Sys::MemInfo',
            'Term::ReadKey', 'Try::Tiny', 'Unicode::String'
          )
          $ppArgs = @('-o', '..\gui\vendor\imapsync\imapsync.exe')
          foreach ($module in $modules) { $ppArgs += @('-M', $module) }
          $ppArgs += '.\imapsync'
          pp @ppArgs
          if ($LASTEXITCODE -ne 0) { throw 'PAR::Packer не смог собрать imapsync.exe' }
          Set-Location ..\gui
          .\vendor\imapsync\imapsync.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Проверка imapsync.exe завершилась ошибкой' }

      - name: Установить PyInstaller
        shell: pwsh
        run: |
          Set-Location gui
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Собрать русскоязычный GUI с imapsync внутри
        shell: pwsh
        run: |
          Set-Location gui
          python -m compileall -q main.py app
          python -m json.tool locales/ru.json | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImapSync-GUI-RU --add-data "locales;locales" --add-binary "vendor/imapsync/imapsync.exe;imapsync" main.py
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/ImapSync-GUI-RU.exe package/
          Compress-Archive -Path package/* -DestinationPath ImapSync-GUI-RU-Windows-x64.zip -Force

      - name: Загрузить готовый комплект
        uses: actions/upload-artifact@v4
        with:
          name: ImapSync-GUI-RU-Windows-x64
          path: gui/ImapSync-GUI-RU-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Приложить архив к GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: gui/ImapSync-GUI-RU-Windows-x64.zip
