name: Сборка ImapSync-GUI и движка imapsync

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'locales/**'
      - '.github/workflows/build-windows.yml'
      - 'build_imapsync.ps1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить GUI
        uses: actions/checkout@v4
        with:
          path: gui

      - name: Получить исходники imapsync
        uses: actions/checkout@v4
        with:
          repository: imapsync/imapsync
          ref: master
          path: upstream

      - name: Установить Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
          distribution: strawberry

      - name: Установить PAR::Packer и зависимости imapsync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cpanm --version
          cpanm --notest App::cpanminus App::PP::Autolink Authen::NTLM Compress::Zlib Crypt::OpenSSL::RSA Data::Uniqid Digest::HMAC Digest::HMAC_MD5 Email::Address Encode::IMAPUTF7 File::Copy::Recursive File::Tail HTTP::Daemon HTTP::Daemon::SSL HTTP::Request HTTP::Response HTTP::Status URI IO::Socket::INET6 IO::Socket::SSL IO::Tee JSON JSON::WebToken JSON::WebToken::Crypt::RSA HTML::Entities LWP::UserAgent Mail::IMAPClient Module::Implementation Module::Runtime Module::ScanDeps Net::Server Net::SSLeay Net::DNS Package::Stash Package::Stash::XS PAR::Packer Parse::RecDescent Proc::ProcessTable Readonly Regexp::Common Sys::MemInfo Term::ReadKey Try::Tiny Unicode::String

      - name: Проверить исходный код и собрать imapsync.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location upstream
          # Test::More нужен только для --tests и не должен загружаться при обычной работе.
          # В upstream он подключается глобально, из-за чего PAR требует всю цепочку Test2.
          $source = Get-Content .\imapsync -Raw
          $testImport = 'use Test::More ;'
          if (-not $source.Contains($testImport)) { throw 'Не найдена ожидаемая строка подключения Test::More в upstream imapsync' }
          $source = $source.Replace($testImport, '# Test::More отключён в portable-сборке: тесты не используются при переносе почты.')
          # Удаляем строки с тестовыми вызовами skip: в обычном режиме они не выполняются.
          $lines = $source -split "`r?`n"
          $source = ($lines | Where-Object { $_ -notlike "*skip 'No test in normal run'*" }) -join "`n"
          if ($source.Contains("skip 'No test in normal run'")) { throw 'Не удалось удалить тестовые вызовы skip' }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'imapsync'), $source, [System.Text.UTF8Encoding]::new($false))
          perl -c .\imapsync
          if ($LASTEXITCODE -ne 0) { throw 'Проверка синтаксиса Perl завершилась ошибкой' }
          New-Item -ItemType Directory -Force -Path ..\gui\vendor\imapsync | Out-Null
          $modules = @(
            'Authen::NTLM', 'Compress::Zlib', 'Crypt::OpenSSL::RSA',
            'Data::Uniqid', 'Digest::HMAC', 'Digest::HMAC_MD5',
            'Email::Address', 'Encode::Unicode', 'Encode::IMAPUTF7', 'File::Copy::Recursive',
            'File::Tail', 'HTTP::Daemon', 'HTTP::Daemon::SSL',
            'HTTP::Request', 'HTTP::Response', 'HTTP::Status', 'URI',
            'IO::Socket::INET6', 'IO::Socket::SSL', 'IO::Tee', 'JSON',
            'JSON::WebToken', 'JSON::WebToken::Crypt::RSA', 'HTML::Entities',
            'LWP::UserAgent', 'Mail::IMAPClient', 'Module::Implementation',
            'Module::Runtime', 'Net::Server', 'Net::SSLeay', 'Net::DNS',
            'Package::Stash', 'Package::Stash::XS', 'Parse::RecDescent',
            'Proc::ProcessTable', 'Readonly', 'Regexp::Common', 'Sys::MemInfo',
            'Term::ReadKey', 'Try::Tiny', 'Unicode::String'
          )
          $ppArgs = @('-o', '..\gui\vendor\imapsync\imapsync.exe')
          foreach ($module in $modules) { $ppArgs += @('-M', $module) }
          $ppArgs += '.\imapsync'
          # pp_autolink рекурсивно добавляет нативные DLL-зависимости XS-модулей,
          # включая OpenSSL DLL, необходимые Net::SSLeay.
          pp_autolink @ppArgs
          if ($LASTEXITCODE -ne 0) { throw 'pp_autolink не смог собрать imapsync.exe с нативными DLL-зависимостями' }
          Set-Location ..\gui
          .\vendor\imapsync\imapsync.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Проверка imapsync.exe завершилась ошибкой' }

          # Проверяем декодирование IMAP-UTF-7 внутри упакованного Perl EXE.
          # В имени папки используются символы японского и китайского алфавитов,
          # поэтому тест гарантированно задействует UTF-16BE.
          @'
          use strict;
          use warnings;
          use Encode qw(decode encode);
          use Encode::Unicode;
          use Encode::IMAPUTF7;
          my $actual = decode('IMAP-UTF-7', '~peter/mail/&ZeVnLIqe-/&U,BTFw-');
          # Сравниваем UTF-8-байты, чтобы тест не зависел от кодировки исходника.
          my $actual_utf8_hex = unpack('H*', encode('UTF-8', $actual));
          my $expected_utf8_hex = '7e70657465722f6d61696c2fe697a5e69cace8aa9e2fe58fb0e58c97';
          die "IMAP-UTF-7 decode test failed (UTF-8 hex: $actual_utf8_hex)\n"
            unless $actual_utf8_hex eq $expected_utf8_hex;
          print "IMAP-UTF-7 decode test passed\n";
          '@ | Set-Content -Encoding utf8 .\imaputf7-smoke.pl
          pp_autolink -o .\imaputf7-smoke.exe -M Encode::Unicode -M Encode::IMAPUTF7 .\imaputf7-smoke.pl
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось собрать тест декодирования IMAP-UTF-7' }
          .\imaputf7-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Тест декодирования IMAP-UTF-7 завершился ошибкой' }
          Remove-Item .\imaputf7-smoke.pl, .\imaputf7-smoke.exe -Force

      - name: Проверить пакетную миграцию и CSV
        shell: pwsh
        run: |
          Set-Location gui
          python -m compileall -q main.py app tests
          python -m unittest discover -s tests -v
          python -m json.tool locales/ru.json | Out-Null

      - name: Установить PyInstaller
        shell: pwsh
        run: |
          Set-Location gui
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Собрать русскоязычный GUI с imapsync внутри
        shell: pwsh
        run: |
          Set-Location gui
          python -m compileall -q main.py app
          python -m json.tool locales/ru.json | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImapSync-GUI-RU --add-data "locales;locales" --add-binary "vendor/imapsync/imapsync.exe;imapsync" main.py
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/ImapSync-GUI-RU.exe package/
          Compress-Archive -Path package/* -DestinationPath ImapSync-GUI-RU-Windows-x64.zip -Force

      - name: Загрузить готовый комплект
        uses: actions/upload-artifact@v4
        with:
          name: ImapSync-GUI-RU-Windows-x64
          path: gui/ImapSync-GUI-RU-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Создать GitHub Release и приложить архив
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location gui
          $tag = "windows-build-$($env:GITHUB_RUN_NUMBER)"
          $title = "ImapSync-GUI — Windows x64 build $($env:GITHUB_RUN_NUMBER)"
          gh release create $tag "ImapSync-GUI-RU-Windows-x64.zip" --title $title --notes "Готовая portable-сборка ImapSync-GUI для Windows x64. В архив включён imapsync.exe, собранный из официального исходного кода imapsync/imapsync."
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать GitHub Release или загрузить архив' }
